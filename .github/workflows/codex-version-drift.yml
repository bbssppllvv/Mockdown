name: Codex version drift

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-codex-version:
    name: check-codex-version
    if: github.repository == 'KjellKod/sketch2md'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Codex CLI registry drift
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Codex CLI version drift
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(tr -d '[:space:]' < .github/codex-cli-version.txt)"
          LATEST_VERSION="$(npm view @openai/codex version)"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "Codex CLI version is current: $CURRENT_VERSION"
            exit 0
          fi

          LATEST_INTEGRITY="$(npm view @openai/codex@${LATEST_VERSION} dist.integrity)"

          BODY="$(mktemp)"
          cat >"$BODY" <<EOF
          Checked-in Codex CLI version: \`$CURRENT_VERSION\`
          Latest npm registry version: \`$LATEST_VERSION\`
          Latest npm tarball integrity: \`$LATEST_INTEGRITY\`

          The CI review workflow installs the pinned tarball declared in
          \`.github/codex-cli-version.txt\` and verifies it against the SHA-512
          recorded in \`.github/codex-cli-integrity.txt\` before running it.

          To accept this drift, vet the release notes for \`@openai/codex\` at
          this version, then update **both** files in the same commit:
          - \`.github/codex-cli-version.txt\` → \`$LATEST_VERSION\`
          - \`.github/codex-cli-integrity.txt\` → \`$LATEST_INTEGRITY\`
          EOF

          ISSUE_NUMBER="$(
            gh issue list \
              --state open \
              --search "$ISSUE_TITLE in:title" \
              --json number,title \
              --jq 'map(select(.title | startswith(env.ISSUE_TITLE))) | .[0].number // empty'
          )"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file "$BODY"
            gh issue comment "$ISSUE_NUMBER" --body "Codex CLI drift still present: checked-in $CURRENT_VERSION, latest $LATEST_VERSION."
          else
            gh issue create --title "$ISSUE_TITLE: $CURRENT_VERSION -> $LATEST_VERSION" --body-file "$BODY"
          fi
